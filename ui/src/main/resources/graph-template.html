<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color, #ffffff);
            color: var(--text-color, #333333);
            overflow: hidden;
        }
        
        body.dark {
            --bg-color: #2b2b2b;
            --text-color: #a9b7c6;
            --border-color: #3c3f41;
            --input-bg: #3c3f41;
        }
        
        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color, #e0e0e0);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 10px;
            z-index: 100;
        }
        
        .search-box {
            flex: 1;
            max-width: 300px;
            padding: 6px 10px;
            border: 1px solid var(--border-color, #e0e0e0);
            border-radius: 4px;
            background: var(--input-bg, #ffffff);
            color: var(--text-color);
            font-size: 13px;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #4dabf7;
        }
        
        .zoom-controls {
            display: flex;
            gap: 5px;
        }
        
        .zoom-btn {
            width: 28px;
            height: 28px;
            border: 1px solid var(--border-color, #e0e0e0);
            border-radius: 4px;
            background: var(--input-bg, #ffffff);
            color: var(--text-color);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .zoom-btn:hover {
            background: #4dabf7;
            color: white;
        }
        
        .zoom-level {
            font-size: 12px;
            color: var(--text-color);
            min-width: 50px;
            text-align: center;
        }
        
        .graph-container {
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            cursor: grab;
        }
        
        .graph-container:active {
            cursor: grabbing;
        }
        
        .graph-wrapper {
            transform-origin: top left;
            padding: 20px;
        }
        
        .mermaid {
            display: flex;
            justify-content: center;
        }
        
        .node {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .node:hover {
            opacity: 0.8;
        }
        
        .node.dimmed {
            opacity: 0.3;
        }
        
        .node.highlighted {
            opacity: 1;
        }
        
        .stats {
            font-size: 11px;
            color: var(--text-color);
            opacity: 0.7;
        }
        
        .empty-message {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-color);
            opacity: 0.5;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <input type="text" class="search-box" id="searchBox" placeholder="Search nodes...">
        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomIn()">+</button>
            <button class="zoom-btn" onclick="zoomOut()">-</button>
            <button class="zoom-btn" onclick="resetView()">R</button>
        </div>
        <span class="zoom-level" id="zoomLevel">100%</span>
        <span class="stats" id="stats"></span>
    </div>
    
    <div class="graph-container" id="graphContainer">
        <div class="graph-wrapper" id="graphWrapper">
            <pre class="mermaid">
<!--GRAPH_CONTENT-->
            </pre>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;
        let nodeIdMap = {};
        
        const container = document.getElementById('graphContainer');
        const wrapper = document.getElementById('graphWrapper');
        
        mermaid.initialize({
            startOnLoad: true,
            theme: document.body.classList.contains('dark') ? 'dark' : 'default',
            flowchart: {
                curve: 'basis',
                padding: 15
            },
            securityLevel: 'loose'
        });
        
        mermaid.run().then(() => {
            setupNodeClickHandlers();
            updateStats();
        });
        
        function setupNodeClickHandlers() {
            document.querySelectorAll('.node').forEach(node => {
                node.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const nodeId = this.id;
                    if (window.jsBridge && nodeIdMap[nodeId]) {
                        window.jsBridge.onNodeClick(nodeIdMap[nodeId]);
                    }
                });
            });
        }
        
        function updateStats() {
            const nodeCount = document.querySelectorAll('.node').length;
            const edgeCount = document.querySelectorAll('.edge-path').length;
            document.getElementById('stats').textContent = nodeCount + ' nodes, ' + edgeCount + ' edges';
        }
        
        function zoomIn() {
            scale = Math.min(scale + 0.2, 3);
            applyTransform();
        }
        
        function zoomOut() {
            scale = Math.max(scale - 0.2, 0.3);
            applyTransform();
        }
        
        function resetView() {
            scale = 1;
            panX = 0;
            panY = 0;
            applyTransform();
        }
        
        function applyTransform() {
            wrapper.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
            document.getElementById('zoomLevel').textContent = Math.round(scale * 100) + '%';
        }
        
        container.addEventListener('mousedown', (e) => {
            if (e.target === container || e.target === wrapper) {
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            }
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                applyTransform();
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            scale = Math.max(0.3, Math.min(3, scale + delta));
            applyTransform();
        });
        
        document.getElementById('searchBox').addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            document.querySelectorAll('.node').forEach(node => {
                const text = node.textContent.toLowerCase();
                if (query === '' || text.includes(query)) {
                    node.classList.remove('dimmed');
                    node.classList.add('highlighted');
                } else {
                    node.classList.add('dimmed');
                    node.classList.remove('highlighted');
                }
            });
        });
        
        function setNodeIdMap(map) {
            nodeIdMap = map;
        }
        
        function setDarkTheme(isDark) {
            if (isDark) {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
        }
    </script>
</body>
</html>
